<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USDT Free Faucet - اربح مجاناً</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; width: 100%; max-width: 480px; padding: 30px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1 { font-size: 24px; margin-bottom: 8px; color: #38bdf8; }
    p.desc { font-size: 14px; color: #94a3b8; margin-bottom: 24px; }
    .input-group { margin-bottom: 16px; text-align: right; }
    label { display: block; font-size: 13px; margin-bottom: 8px; color: #cbd5e1; }
    input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 15px; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #38bdf8; }
    .captcha-box { background: #0f172a; border: 1px dashed #38bdf8; border-radius: 10px; padding: 12px; margin-bottom: 20px; }
    .captcha-text { font-size: 16px; font-weight: bold; color: #38bdf8; margin-bottom: 8px; }
    button { width: 100%; padding: 14px; background: #0284c7; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .btn-step2 { background: #10b981; }
    .btn-step2:hover { background: #059669; }
    #msg { margin-top: 20px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; }
    .success { background: rgba(34, 197, 94, 0.15); border: 1px solid #22c55e; color: #4ade80; }
    .error { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #f87171; }
    .info-box { margin-top: 24px; padding: 14px; background: #0f172a; border-radius: 10px; font-size: 13px; color: #94a3b8; display: flex; justify-content: space-around; }
    .info-box span { color: #f8fafc; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h1>حنفية USDT المجانية</h1>
    <p class="desc">احصل على 30 ساتوشي USDT كل 10 دقائق فورياً على FaucetPay</p>

    <div class="input-group">
      <label>عنوان USDT أو إيميل حسابك في FaucetPay:</label>
      <input type="text" id="address" placeholder="name@example.com أو عنوان المحفظة" dir="ltr">
    </div>

    <!-- خانة الكابتشا الحسابية -->
    <div class="captcha-box">
      <div class="captcha-text" id="captchaQuestion">أمان الصنبور: جاري التحميل...</div>
      <input type="number" id="captchaAnswer" placeholder="أدخل ناتج العملية هنا" dir="ltr">
    </div>

    <!-- زر الخطوة 1: فحص الكابتشا وفتح الإعلان الأول -->
    <button id="step1Btn" onclick="verifyAndOpenAd1()">تأكيد ومتابعة (خطوة 1/2)</button>

    <!-- زر الخطوة 2: فتح الإعلان الثاني وسحب العملات -->
    <button id="claimBtn" class="btn-step2" onclick="claimReward()" style="display: none;">سحب المكافأة الآن (خطوة 2/2)</button>

    <div id="msg"></div>

    <div class="info-box">
      <div>المكافأة: <span>30 Satoshi</span></div>
      <div>الانتظار: <span>10 دقائق</span></div>
    </div>
  </div>

  <script>
    // رابط Monetag المباشر الخاص بك
    const MONETAG_LINK_1 = "https://omg10.com/4/11769732";
    const MONETAG_LINK_2 = "https://omg10.com/4/11769732";

    const COOLDOWN_TIME = 10 * 60;
    let expectedSum = 0;

    function generateCaptcha() {
      const num1 = Math.floor(Math.random() * 10) + 1;
      const num2 = Math.floor(Math.random() * 10) + 1;
      expectedSum = num1 + num2;
      document.getElementById('captchaQuestion').innerText = `أمان الصنبور: ما ناتج ${num1} + ${num2} = ؟`;
      document.getElementById('captchaAnswer').value = '';
    }

    function checkCooldown() {
      const lastClaim = localStorage.getItem('last_faucet_claim');
      if (lastClaim) {
        const passed = Math.floor((Date.now() - parseInt(lastClaim)) / 1000);
        if (passed < COOLDOWN_TIME) {
          startTimer(COOLDOWN_TIME - passed);
        }
      }
    }

    function startTimer(secondsLeft) {
      const btn1 = document.getElementById('step1Btn');
      const btn2 = document.getElementById('claimBtn');
      btn2.style.display = 'none';
      btn1.style.display = 'block';
      btn1.disabled = true;

      const interval = setInterval(() => {
        const m = Math.floor(secondsLeft / 60);
        const s = secondsLeft % 60;
        btn1.innerText = `يرجى الانتظار (${m}:${s < 10 ? '0' : ''}${s})`;
        secondsLeft--;
        if (secondsLeft < 0) {
          clearInterval(interval);
          btn1.disabled = false;
          btn1.innerText = 'تأكيد ومتابعة (خطوة 1/2)';
          localStorage.removeItem('last_faucet_claim');
        }
      }, 1000);
    }

    // الخطوة 1: فحص البيانات وفتح الإعلان أول مرة
    function verifyAndOpenAd1() {
      const address = document.getElementById('address').value.trim();
      const userAnswer = parseInt(document.getElementById('captchaAnswer').value.trim(), 10);
      const msgDiv = document.getElementById('msg');
      const btn1 = document.getElementById('step1Btn');

      if (!address) {
        showMessage('يرجى كتابة عنوان محفظتك أو إيميل FaucetPay أولاً', 'error');
        return;
      }

      if (isNaN(userAnswer) || userAnswer !== expectedSum) {
        showMessage('إجابة العملية الحسابية غير صحيحة، حاول مجدداً', 'error');
        generateCaptcha();
        return;
      }

      msgDiv.style.display = 'none';

      // فتح الإعلان في تبويب جديد
      window.open(MONETAG_LINK_1, '_blank');

      // عد تنازلي 5 ثوانٍ ثم إظهار زر السحب
      btn1.disabled = true;
      let countdown = 5;
      btn1.innerText = `جاري التحقق (${countdown})...`;

      const timer = setInterval(() => {
        countdown--;
        if (countdown > 0) {
          btn1.innerText = `جاري التحقق (${countdown})...`;
        } else {
          clearInterval(timer);
          btn1.style.display = 'none';
          document.getElementById('claimBtn').style.display = 'block';
        }
      }, 1000);
    }

    // الخطوة 2: فتح الإعلان ثاني مرة وإرسال الساتوشي
    async function claimReward() {
      const address = document.getElementById('address').value.trim();
      const msgDiv = document.getElementById('msg');
      const btn2 = document.getElementById('claimBtn');

      // فتح الإعلان مرة ثانية لاحتساب ظهور إضافي
      window.open(MONETAG_LINK_2, '_blank');

      btn2.disabled = true;
      btn2.innerText = 'جاري التحقق والإرسال...';
      msgDiv.style.display = 'none';

      try {
        const response = await fetch('/api/claim', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ address })
        });

        const data = await response.json();

        if (data.success) {
          showMessage(data.message, 'success');
          localStorage.setItem('last_faucet_claim', Date.now().toString());
          startTimer(COOLDOWN_TIME);
        } else {
          showMessage(data.message || 'تعذر الإرسال، تحقق من العنوان ورصيد الموقع', 'error');
          btn2.disabled = false;
          btn2.innerText = 'سحب المكافأة الآن (خطوة 2/2)';
          generateCaptcha();
        }
      } catch (err) {
        showMessage('حدث خطأ في الاتصال بالسيرفر', 'error');
        btn2.disabled = false;
        btn2.innerText = 'سحب المكافأة الآن (خطوة 2/2)';
        generateCaptcha();
      }
    }

    function showMessage(text, type) {
      const msg = document.getElementById('msg');
      msg.className = type;
      msg.innerText = text;
      msg.style.display = 'block';
    }

    generateCaptcha();
    checkCooldown();
  </script>
</body>
</html>
